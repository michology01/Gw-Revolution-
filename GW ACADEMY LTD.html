<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forex Trading Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    .progress-ring {
      transform: rotate(-90deg);
    }
    .lesson-card {
      transition: all 0.3s ease;
    }
    .lesson-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .quiz-option {
      transition: all 0.2s ease;
    }
    .quiz-option:hover {
      transform: scale(1.02);
    }
    .quiz-option.correct {
      animation: correctAnswer 0.6s ease;
    }
    .quiz-option.incorrect {
      animation: incorrectAnswer 0.6s ease;
    }
    @keyframes correctAnswer {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes incorrectAnswer {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    .module-header {
      transition: all 0.3s ease;
    }
    .module-header:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    .fade-in {
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .pulse {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .candlestick {
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .candlestick:hover {
      transform: scale(1.1);
    }
    .chart-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLine 2s ease forwards;
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
    .notification {
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .calculator-result {
      animation: resultPop 0.4s ease;
    }
    @keyframes resultPop {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .progress-bar-fill {
      transition: width 1s ease;
    }
    .btn-hover {
      position: relative;
      overflow: hidden;
    }
    .btn-hover::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    .btn-hover:hover::before {
      width: 300px;
      height: 300px;
    }
    .ticker-scroll {
      animation: scroll 30s linear infinite;
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-scroll:hover {
      animation-play-state: paused;
    }
    .price-up {
      animation: priceUp 0.5s ease;
    }
    .price-down {
      animation: priceDown 0.5s ease;
    }
    @keyframes priceUp {
      0% { background-color: rgba(34, 197, 94, 0); }
      50% { background-color: rgba(34, 197, 94, 0.3); }
      100% { background-color: rgba(34, 197, 94, 0); }
    }
    @keyframes priceDown {
      0% { background-color: rgba(239, 68, 68, 0); }
      50% { background-color: rgba(239, 68, 68, 0.3); }
      100% { background-color: rgba(239, 68, 68, 0); }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <body class="h-full">
  <div id="app" class="h-full w-full overflow-auto"></div>
  <script>
    const defaultConfig = {
      background_color: "#0f172a",
      surface_color: "#1e293b",
      text_color: "#f1f5f9",
      primary_action_color: "#3b82f6",
      secondary_action_color: "#64748b",
      font_family: "system-ui",
      font_size: 16,
      course_title: "Forex Trading Academy",
      welcome_message: "Master the art of currency trading from beginner to professional",
      footer_text: "© 2024 Forex Trading Academy. For educational purposes only."
    };

    let currentProgress = [];
    let currentView = 'home';
    let selectedModule = null;
    let selectedLesson = null;
    let quizAnswers = {};
    let forexRates = {};
    let previousRates = {};

    // Fetch live Forex rates from API
    async function fetchForexRates() {
      try {
        const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        const data = await response.json();
        
        previousRates = { ...forexRates };
        
        // Convert to common Forex pairs
        forexRates = {
          'EUR/USD': data.rates.EUR ? (1 / data.rates.EUR).toFixed(5) : null,
          'GBP/USD': data.rates.GBP ? (1 / data.rates.GBP).toFixed(5) : null,
          'USD/JPY': data.rates.JPY ? data.rates.JPY.toFixed(3) : null,
          'USD/CHF': data.rates.CHF ? data.rates.CHF.toFixed(5) : null,
          'AUD/USD': data.rates.AUD ? (1 / data.rates.AUD).toFixed(5) : null,
          'USD/CAD': data.rates.CAD ? data.rates.CAD.toFixed(5) : null,
          'NZD/USD': data.rates.NZD ? (1 / data.rates.NZD).toFixed(5) : null
        };
        
        renderTicker();
      } catch (error) {
        console.error('Failed to fetch Forex rates:', error);
      }
    }

    function getPriceChange(pair) {
      if (!previousRates[pair] || !forexRates[pair]) return 'neutral';
      const prev = parseFloat(previousRates[pair]);
      const current = parseFloat(forexRates[pair]);
      if (current > prev) return 'up';
      if (current < prev) return 'down';
      return 'neutral';
    }

    function renderTicker() {
      const tickerEl = document.getElementById('forex-ticker');
      if (!tickerEl) return;

      const pairs = Object.keys(forexRates);
      const tickerHTML = `
        <div class="flex gap-8 ticker-scroll">
          ${pairs.map(pair => {
            const rate = forexRates[pair];
            const change = getPriceChange(pair);
            const color = change === 'up' ? '#22c55e' : change === 'down' ? '#ef4444' : '#94a3b8';
            const arrow = change === 'up' ? '▲' : change === 'down' ? '▼' : '●';
            const animClass = change === 'up' ? 'price-up' : change === 'down' ? 'price-down' : '';
            
            return `
              <div class="flex items-center gap-3 px-4 py-2 rounded ${animClass}">
                <span class="font-bold text-sm">${pair}</span>
                <span class="font-mono text-sm" style="color: ${color};">
                  ${rate} <span class="text-xs">${arrow}</span>
                </span>
              </div>
            `;
          }).join('')}
          ${pairs.map(pair => {
            const rate = forexRates[pair];
            const change = getPriceChange(pair);
            const color = change === 'up' ? '#22c55e' : change === 'down' ? '#ef4444' : '#94a3b8';
            const arrow = change === 'up' ? '▲' : change === 'down' ? '▼' : '●';
            const animClass = change === 'up' ? 'price-up' : change === 'down' ? 'price-down' : '';
            
            return `
              <div class="flex items-center gap-3 px-4 py-2 rounded ${animClass}">
                <span class="font-bold text-sm">${pair}</span>
                <span class="font-mono text-sm" style="color: ${color};">
                  ${rate} <span class="text-xs">${arrow}</span>
                </span>
              </div>
            `;
          }).join('')}
        </div>
      `;
      
      tickerEl.innerHTML = tickerHTML;
    }

    // Update rates every 10 seconds
    setInterval(fetchForexRates, 10000);

    const modules = [
      {
        id: "module-1",
        title: "Forex Fundamentals",
        level: "Beginner",
        lessons: [
          {
            id: "lesson-1-1",
            title: "What is Forex Trading?",
            duration: "15 min",
            content: `
              <h3 class="text-xl font-semibold mb-4">Understanding Forex Trading</h3>
              
              <!-- Visual: Globe representing global market -->
              <div class="mb-6 p-6 rounded-xl text-center" style="background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);">
                <svg viewBox="0 0 200 200" class="w-48 h-48 mx-auto mb-4">
                  <circle cx="100" cy="100" r="80" fill="#60a5fa" opacity="0.3"/>
                  <circle cx="100" cy="100" r="70" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5,5"/>
                  <text x="100" y="80" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">$6.6T</text>
                  <text x="100" y="110" text-anchor="middle" fill="#fff" font-size="14">Daily Volume</text>
                  <text x="100" y="130" text-anchor="middle" fill="#fff" font-size="12">24/5 Trading</text>
                </svg>
                <p class="text-lg font-semibold">The world's largest financial market</p>
              </div>

              <p class="mb-4">The Foreign Exchange market (Forex/FX) is the world's largest financial market where currencies are traded. With over $6.6 trillion traded daily, it operates 24 hours a day, 5 days a week.</p>
              
              <h4 class="text-lg font-semibold mb-2">Key Concepts:</h4>
              <ul class="list-disc pl-6 mb-4 space-y-2">
                <li><strong>Currency Pairs:</strong> Currencies are traded in pairs (e.g., EUR/USD). The first currency is the base, the second is the quote.</li>
                <li><strong>Pip:</strong> The smallest price move in a currency pair (usually 0.0001)</li>
                <li><strong>Lot Size:</strong> Standard (100,000 units), Mini (10,000), Micro (1,000)</li>
                <li><strong>Leverage:</strong> Borrowing capital to increase potential returns (and risks)</li>
              </ul>

              <!-- Visual Example: Currency Pair Display -->
              <div class="bg-blue-900 bg-opacity-30 p-6 rounded-lg mb-4">
                <h4 class="font-semibold mb-4 text-center">💡 Live Example: EUR/USD Price Movement</h4>
                <div class="grid grid-cols-2 gap-4 mb-4">
                  <div class="bg-black bg-opacity-30 p-4 rounded-lg text-center">
                    <div class="text-sm opacity-70 mb-1">Initial Price</div>
                    <div class="text-3xl font-bold text-blue-400">1.1000</div>
                  </div>
                  <div class="bg-black bg-opacity-30 p-4 rounded-lg text-center">
                    <div class="text-sm opacity-70 mb-1">New Price</div>
                    <div class="text-3xl font-bold text-green-400">1.1050</div>
                    <div class="text-sm text-green-400 mt-1">+50 pips ���</div>
                  </div>
                </div>
                <div class="text-center p-4 bg-green-900 bg-opacity-30 rounded">
                  <p class="mb-2"><strong>What happened?</strong></p>
                  <p class="text-sm">1 Euro went from $1.10 to $1.105 USD. If you bought 1 standard lot (100,000 EUR), you gained <strong>$500</strong> (50 pips × $10/pip)</p>
                </div>
              </div>

              <!-- Visual: Lot Size Comparison -->
              <div class="mb-4 p-4 rounded-lg" style="background: linear-gradient(135deg, #1f2937 0%, #374151 100%);">
                <h4 class="font-semibold mb-3 text-center">📊 Lot Size Comparison</h4>
                <div class="space-y-3">
                  <div class="flex items-center gap-3">
                    <div class="w-32 h-12 bg-blue-600 rounded flex items-center justify-center text-xs font-bold">STANDARD</div>
                    <div class="flex-1">100,000 units • $10/pip • Pro traders</div>
                  </div>
                  <div class="flex items-center gap-3">
                    <div class="w-24 h-10 bg-blue-500 rounded flex items-center justify-center text-xs font-bold">MINI</div>
                    <div class="flex-1">10,000 units • $1/pip • Intermediate</div>
                  </div>
                  <div class="flex items-center gap-3">
                    <div class="w-16 h-8 bg-blue-400 rounded flex items-center justify-center text-xs font-bold">MICRO</div>
                    <div class="flex-1">1,000 units ����� $0.10/pip • Beginners</div>
                  </div>
                </div>
              </div>

              <h4 class="text-lg font-semibold mb-2">Market Participants:</h4>
              <ul class="list-disc pl-6 space-y-2">
                <li>Central Banks</li>
                <li>Commercial Banks</li>
                <li>Hedge Funds</li>
                <li>Retail Traders (You!)</li>
              </ul>
            `,
            quiz: {
              question: "What does a pip typically represent in Forex trading?",
              options: [
                "A 1% price movement",
                "The smallest price move (usually 0.0001)",
                "A 10-point movement",
                "The daily trading volume"
              ],
              correct: 1
            }
          },
          {
            id: "lesson-1-2",
            title: "Major Currency Pairs",
            duration: "12 min",
            content: `
              <h3 class="text-xl font-semibold mb-4">Understanding Currency Pairs</h3>
              
              <h4 class="text-lg font-semibold mb-2">Major Pairs (Most Liquid):</h4>
              <div class="space-y-3 mb-4">
                <div class="bg-blue-900 bg-opacity-20 p-3 rounded">
                  <strong>EUR/USD</strong> - Euro vs US Dollar (Most traded pair)
                </div>
                <div class="bg-blue-900 bg-opacity-20 p-3 rounded">
                  <strong>USD/JPY</strong> - US Dollar vs Japanese Yen
                </div>
                <div class="bg-blue-900 bg-opacity-20 p-3 rounded">
                  <strong>GBP/USD</strong> - British Pound vs US Dollar ("Cable")
                </div>
                <div class="bg-blue-900 bg-opacity-20 p-3 rounded">
                  <strong>USD/CHF</strong> - US Dollar vs Swiss Franc
                </div>
              </div>

              <h4 class="text-lg font-semibold mb-2">Commodity Pairs:</h4>
              <ul class="list-disc pl-6 mb-4 space-y-2">
                <li><strong>AUD/USD</strong> - Australian Dollar (Gold, Mining)</li>
                <li><strong>USD/CAD</strong> - Canadian Dollar (Oil)</li>
                <li><strong>NZD/USD</strong> - New Zealand Dollar (Agriculture)</li>
              </ul>

              <div class="bg-green-900 bg-opacity-30 p-4 rounded-lg mb-4">
                <h4 class="font-semibold mb-2">📊 Trading Tip:</h4>
                <p>Begin with major pairs as they have tighter spreads, higher liquidity, and more predictable movements. EUR/USD typically has the lowest spread.</p>
              </div>

              <h4 class="text-lg font-semibold mb-2">Spread Explained:</h4>
              <p class="mb-2">The difference between bid (sell) and ask (buy) price. Lower spreads mean lower trading costs.</p>
              <p class="italic">Example: EUR/USD Bid: 1.1000 | Ask: 1.1002 = 2 pip spread</p>
            `,
            quiz: {
              question: "Which currency pair is known as 'Cable'?",
              options: ["EUR/USD", "USD/JPY", "GBP/USD", "USD/CHF"],
              correct: 2
            }
          },
          {
            id: "lesson-1-3",
            title: "Market Sessions & Timing",
            duration: "10 min",
            content: `
              <h3 class="text-xl font-semibold mb-4">Global Trading Sessions</h3>
              
              <p class="mb-4">Forex operates 24/5 across four major sessions. Each has unique characteristics:</p>

              <!-- Visual: 24-Hour Trading Clock -->
              <div class="mb-6 p-6 rounded-xl" style="background: linear-gradient(135deg, #1e293b 0%, #334155 100%);">
                <h4 class="font-semibold mb-4 text-center">⏰ 24-Hour Forex Trading Clock (GMT)</h4>
                <svg viewBox="0 0 400 200" class="w-full h-auto">
                  <!-- Sydney Session -->
                  <rect x="10" y="20" width="80" height="40" rx="5" fill="#3b82f6" opacity="0.5"/>
                  <text x="50" y="35" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">SYDNEY</text>
                  <text x="50" y="50" text-anchor="middle" fill="#fff" font-size="8">22:00-07:00</text>
                  
                  <!-- Tokyo Session -->
                  <rect x="90" y="20" width="90" height="40" rx="5" fill="#a855f7" opacity="0.6"/>
                  <text x="135" y="35" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">TOKYO</text>
                  <text x="135" y="50" text-anchor="middle" fill="#fff" font-size="8">00:00-09:00</text>
                  
                  <!-- London Session -->
                  <rect x="160" y="20" width="120" height="40" rx="5" fill="#22c55e" opacity="0.7"/>
                  <text x="220" y="35" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">LONDON ⭐</text>
                  <text x="220" y="50" text-anchor="middle" fill="#fff" font-size="8">08:00-17:00</text>
                  
                  <!-- New York Session -->
                  <rect x="230" y="20" width="120" height="40" rx="5" fill="#ef4444" opacity="0.6"/>
                  <text x="290" y="35" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">NEW YORK</text>
                  <text x="290" y="50" text-anchor="middle" fill="#fff" font-size="8">13:00-22:00</text>
                  
                  <!-- Overlap Highlight -->
                  <rect x="230" y="75" width="50" height="30" rx="5" fill="#fbbf24" opacity="0.8"/>
                  <text x="255" y="88" text-anchor="middle" fill="#000" font-size="9" font-weight="bold">OVERLAP</text>
                  <text x="255" y="100" text-anchor="middle" fill="#000" font-size="7">13:00-17:00</text>
                  
                  <!-- Volume bars -->
                  <text x="10" y="130" fill="#94a3b8" font-size="9">Volume:</text>
                  <rect x="10" y="140" width="30" height="50" fill="#3b82f6" opacity="0.5"/>
                  <rect x="90" y="125" width="40" height="65" fill="#a855f7" opacity="0.6"/>
                  <rect x="160" y="100" width="60" height="90" fill="#22c55e" opacity="0.7"/>
                  <rect x="230" y="110" width="60" height="80" fill="#ef4444" opacity="0.6"/>
                  <rect x="230" y="85" width="50" height="105" fill="#fbbf24" opacity="0.3"/>
                  <text x="255" y="175" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="bold">BEST!</text>
                </svg>
              </div>

              <div class="space-y-3 mb-4">
                <div class="bg-blue-900 bg-opacity-20 p-4 rounded">
                  <h4 class="font-semibold mb-2">🌏 Sydney Session (10 PM - 7 AM GMT)</h4>
                  <p class="mb-2">Quietest session. Good for AUD and NZD pairs.</p>
                  <div class="text-xs opacity-70">Average pip range: 50-80 pips</div>
                </div>
                
                <div class="bg-purple-900 bg-opacity-20 p-4 rounded">
                  <h4 class="font-semibold mb-2">🗼 Tokyo Session (12 AM - 9 AM GMT)</h4>
                  <p class="mb-2">Asian market opens. High activity in JPY pairs. Sets Asian trading range.</p>
                  <div class="text-xs opacity-70">Average pip range: 60-100 pips</div>
                </div>
                
                <div class="bg-green-900 bg-opacity-20 p-4 rounded">
                  <h4 class="font-semibold mb-2">🏛️ London Session (8 AM - 5 PM GMT)</h4>
                  <p class="mb-2">Highest volume! 35% of Forex turnover. Major trends often begin here.</p>
                  <div class="text-xs opacity-70">Average pip range: 100-150 pips • BEST for trend trading</div>
                </div>
                
                <div class="bg-red-900 bg-opacity-20 p-4 rounded">
                  <h4 class="font-semibold mb-2">🗽 New York Session (1 PM - 10 PM GMT)</h4>
                  <p class="mb-2">Second highest volume. USD pairs most active. Economic data releases.</p>
                  <div class="text-xs opacity-70">Average pip range: 80-120 pips</div>
                </div>
              </div>

              <div class="bg-yellow-900 bg-opacity-30 p-4 rounded-lg mb-4">
                <h4 class="font-semibold mb-2">⚡ Best Trading Times:</h4>

            quiz: {
              question: "Which session overlap offers the highest trading volume?",

              correct: 2
            }
          }
        ]
      },
      {
        id: "module-2",
        title: "Technical Analysis",
        level: "Intermediate",
        lessons: [
          {
            id: "lesson-2-1",
            title: "Chart Types & Patterns",
            duration: "20 min",
            content: `
              <h3 class="text-xl font-semibold mb-4">Reading Forex Charts</h3>
              
              <h4 class="text-lg font-semibold mb-2">Chart Types:</h4>
              <div class="space-y-3 mb-4">
                <div class="bg-blue-900 bg-opacity-20 p-3 rounded">
                  <strong>📈 Line Chart:</strong> Connects closing prices. Simple but limited information.
                </div>
                <div class="bg-blue-900 bg-opacity-20 p-3 rounded">
                  <strong>📊 Bar Chart:</strong> Shows Open, High, Low, Close (OHLC). More detailed.
                </div>
                <div class="bg-blue-900 bg-opacity-20 p-3 rounded">
                  <strong>🕯️ Candlestick Chart:</strong> Most popular! Visual representation of price action.
                </div>
              </div>

              <!-- Visual: Candlestick Anatomy -->
              <div class="mb-6 p-6 rounded-xl" style="background: linear-gradient(135deg, #1e293b 0%, #334155 100%);">
                <h4 class="font-semibold mb-4 text-center">🕯️ Candlestick Anatomy</h4>
                <svg viewBox="0 0 500 300" class="w-full h-auto mb-4">
                  <!-- Bullish Candle -->
                  <text x="100" y="25" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="bold">BULLISH CANDLE</text>
                  <line x1="100" y1="50" x2="100" y2="80" stroke="#22c55e" stroke-width="2"/>
                  <rect x="80" y="80" width="40" height="100" fill="#22c55e" stroke="#22c55e" stroke-width="2"/>
                  <line x1="100" y1="180" x2="100" y2="220" stroke="#22c55e" stroke-width="2"/>
                  
                  <text x="40" y="60" fill="#94a3b8" font-size="10">← High</text>
                  <text x="40" y="90" fill="#94a3b8" font-size="10">← Open</text>
                  <text x="40" y="180" fill="#94a3b8" font-size="10">← Close</text>
                  <text x="40" y="220" fill="#94a3b8" font-size="10">← Low</text>
                  
                  <text x="160" y="60" fill="#94a3b8" font-size="10">Upper Wick</text>
                  <text x="160" y="130" fill="#94a3b8" font-size="10">Body (Green)</text>
                  <text x="160" y="210" fill="#94a3b8" font-size="10">Lower Wick</text>
                  
                  <!-- Bearish Candle -->
                  <text x="350" y="25" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="bold">BEARISH CANDLE</text>
                  <line x1="350" y1="50" x2="350" y2="80" stroke="#ef4444" stroke-width="2"/>
                  <rect x="330" y="80" width="40" height="100" fill="#ef4444" stroke="#ef4444" stroke-width="2"/>
                  <line x1="350" y1="180" x2="350" y2="220" stroke="#ef4444" stroke-width="2"/>

              <h3 class="text-xl font-semibold mb-4">Calculating Proper Position Size</h3>
              
              <p class="mb-4 font-semibold text-red-400">Risk management is MORE important than your trading strategy!</p>

              <h4 class="text-lg font-semibold mb-2">The 1-2% Rule:</h4>
              <div class="bg-red-900 bg-opacity-30 p-4 rounded-lg mb-4">
                <p class="mb-2"><strong>Never risk more than 1-2% of your account on a single trade.</strong></p>
                <p class="text-sm">This ensures you can survive 50+ losing trades before depleting your account.</p>
              </div>

              <h4 class="text-lg font-semibold mb-2">Position Size Formula:</h4>
              <div class="bg-blue-900 bg-opacity-20 p-4 rounded mb-4 font-mono text-sm">
                Position Size = (Account Balance × Risk %) ÷ (Stop Loss in Pips × Pip Value)
              </div>

              <div class="bg-green-900 bg-opacity-30 p-4 rounded-lg mb-4">
                <h4 class="font-semibold mb-2">💡 Example:</h4>
                <p class="mb-2">Account: $10,000 | Risk: 1% ($100) | Stop Loss: 50 pips</p>
                <p class="mb-2">For EUR/USD (pip value = $10 per standard lot):</p>
                <p class="font-mono">$100 ÷ (50 pips × $10) = 0.2 lots or 20,000 units</p>
              </div>

              <h4 class="text-lg font-semibold mb-2">Key Principles:</h4>
              <ul class="list-disc pl-6 mb-4 space-y-2">
                <li><strong>Fixed Risk:</strong> Always risk the same % regardless of confidence</li>
                <li><strong>Wider Stop = Smaller Position:</strong> Adjust size based on stop distance</li>
                <li><strong>Account for Spread:</strong> Factor in spread costs</li>
                <li><strong>Leverage Wisely:</strong> Lower leverage = lower risk</li>
              </ul>

              <h4 class="text-lg font-semibold mb-2">Leverage Guidelines:</h4>
              <div class="space-y-2">
                <p>🟢 <strong>Beginners:</strong> 1:10 or 1:20 maximum</p>
                <p>🟡 <strong>Intermediate:</strong> 1:30 to 1:50</p>
                <p>🔴 <strong>Advanced:</strong> Up to 1:100 (with strict discipline)</p>
              </div>

              <p class="mt-4 text-sm italic">Higher leverage amplifies both gains AND losses. Most retail traders blow accounts from over-leveraging.</p>

              <div class="bg-red-900 bg-opacity-20 p-4 rounded mb-4">
                <p class="mb-2">Pre-determined exit point to limit losses on a trade.</p>
                <p class="font-semibold text-red-400">NEVER trade without a stop loss!</p>

              <h4 class="text-lg font-semibold mb-2">Where to Place Stop Loss:</h4>
              <ul class="list-disc pl-6 mb-4 space-y-2">
                <li><strong>Below Support (Long):</strong> Give it breathing room (10-20 pips buffer)</li>
                <li><strong>Above Resistance (Short):</strong> Allow for false breakouts</li>

    async function onConfigChange(config) {
      const customFont = config.font_family || defaultConfig.font_family;
      const fontSize = config.font_size || defaultConfig.font_size;
      const bgColor = config.background_color || defaultConfig.background_color;
      const surfaceColor = config.surface_color || defaultConfig.surface_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
      const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;

      document.body.style.backgroundColor = bgColor;
      document.body.style.color = textColor;
      document.body.style.fontFamily = `${customFont}, system-ui, -apple-system, sans-serif`;
      document.body.style.fontSize = `${fontSize}px`;

      const allText = document.querySelectorAll('body, body *');
      allText.forEach(el => {
        if (!el.style.fontFamily) {
          el.style.fontFamily = `${customFont}, system-ui, -apple-system, sans-serif`;
        }
      });

      const titles = document.querySelectorAll('h1');
      titles.forEach(el => el.style.fontSize = `${fontSize * 2}px`);

      const subtitles = document.querySelectorAll('h2');
      subtitles.forEach(el => el.style.fontSize = `${fontSize * 1.5}px`);

      const headings = document.querySelectorAll('h3');
      headings.forEach(el => el.style.fontSize = `${fontSize * 1.25}px`);

      const subheadings = document.querySelectorAll('h4');
      subheadings.forEach(el => el.style.fontSize = `${fontSize * 1.1}px`);

      const surfaces = document.querySelectorAll('[data-surface]');
      surfaces.forEach(el => el.style.backgroundColor = surfaceColor);

      const primaryButtons = document.querySelectorAll('[data-primary-btn]');
      primaryButtons.forEach(el => {
        el.style.backgroundColor = primaryColor;
        el.style.borderColor = primaryColor;
      });

      const secondaryButtons = document.querySelectorAll('[data-secondary-btn]');
      secondaryButtons.forEach(el => {
        el.style.backgroundColor = secondaryColor;
        el.style.borderColor = secondaryColor;
      });

      const allElements = document.querySelectorAll('*');
      allElements.forEach(el => {
        if (el.style.color && el.style.color === defaultConfig.text_color) {
          el.style.color = textColor;
        }
      });

      renderApp();
    }

    function getLessonProgress(moduleId, lessonId) {
      return currentProgress.find(p => p.module_id === moduleId && p.lesson_id === lessonId);
    }

    function getModuleProgress(moduleId) {
      const lessons = modules.find(m => m.id === moduleId)?.lessons || [];
      const completed = lessons.filter(l => getLessonProgress(moduleId, l.id)?.completed).length;
      return { completed, total: lessons.length, percentage: (completed / lessons.length) * 100 };
    }

    function getTotalProgress() {
      const allLessons = modules.reduce((acc, m) => acc + m.modules.length, 0);
      const completedLessons = currentProgress.filter(p => p.completed).length;
      return { completed: completedLessons, total: allLessons, percentage: (completedLessons / allLessons) * 100 };
    }

    async function markLessonComplete(moduleId, lessonId, quizScore) {
      const existing = currentProgress.find(p => p.module_id === moduleId && p.lesson_id === lessonId);
      
      if (existing) {
        const updatedProgress = {
          ...existing,
          completed: true,
          quiz_score: quizScore,
          completed_at: new Date().toISOString()
        };
        const result = await window.dataSdk.update(updatedProgress);
        if (!result.isOk) {
          showNotification('Failed to update progress. Please try again.', 'error');
        }
      } else {
        const newProgress = {
          module_id: moduleId,
          lesson_id: lessonId,
          completed: true,
          quiz_score: quizScore,
          completed_at: new Date().toISOString()
        };
        
        if (currentProgress.length >= 999) {
          showNotification('Progress limit reached (999 records). Cannot save more progress.', 'error');
          return;
        }
        
        const result = await window.dataSdk.create(newProgress);
        if (!result.isOk) {
          showNotification('Failed to save progress. Please try again.', 'error');
        }
      }
    }

    function showNotification(message, type = 'success') {
      const notification = document.createElement('div');
      notification.className = `notification fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'} text-white`;
      notification.textContent = message;
      document.body.appendChild(notification);
      setTimeout(() => {
        notification.style.animation = 'slideIn 0.3s ease reverse';
        setTimeout(() => notification.remove(), 300);
      }, 2700);
    }

      const score = isCorrect ? 100 : 0;

      const submitBtn = event.target;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving progress...';

      await markLessonComplete(moduleId, lessonId, score);

      showNotification(isCorrect ? '🎉 Correct! Lesson completed.' : '��� Lesson completed. Review the material to master it.');
      
      setTimeout(() => {
        currentView = 'lessons';
        selectedLesson = null;
        quizAnswers = {};

    function calculatePositionSize() {
      const balance = parseFloat(document.getElementById('accountBalance').value);
      const riskPercent = parseFloat(document.getElementById('riskPercent').value);
      const stopLoss = parseFloat(document.getElementById('stopLoss').value);
      const resultEl = document.getElementById('positionResult');

      if (!balance || !riskPercent || !stopLoss) {
        resultEl.textContent = 'Please fill all fields';
        resultEl.className = 'text-center font-bold text-sm sm:text-base';
        return;
      }

      const riskAmount = balance * (riskPercent / 100);
      const pipValue = 10; // Standard lot for major pairs
      const lotSize = riskAmount / (stopLoss * pipValue);

      resultEl.className = 'calculator-result text-center font-bold text-sm sm:text-base';
      resultEl.textContent = 
        `Position Size: ${lotSize.toFixed(2)} lots (${(lotSize * 100000).toFixed(0)} units)`;
    }

    function calculateRiskReward() {
      const entry = parseFloat(document.getElementById('entryPrice').value);
      const sl = parseFloat(document.getElementById('slPrice').value);
      const tp = parseFloat(document.getElementById('tpPrice').value);
      const resultEl = document.getElementById('rrResult');

      if (!entry || !sl || !tp) {
        resultEl.textContent = 'Please fill all fields';
        resultEl.className = 'text-center font-bold text-lg';
        return;
      }

      const risk = Math.abs(entry - sl);
      const reward = Math.abs(tp - entry);
      const ratio = reward / risk;

      resultEl.className = 'calculator-result text-center font-bold text-lg';
      resultEl.textContent = 
        `Risk:Reward = 1:${ratio.toFixed(2)} | Risk: ${(risk * 10000).toFixed(0)} pips | Reward: ${(reward * 10000).toFixed(0)} pips`;
    }

    function calculatePipValue() {
      const lotSize = parseFloat(document.getElementById('lotSize').value);
      const basePipValue = parseFloat(document.getElementById('currencyPair').value);
      const resultEl = document.getElementById('pipResult');

      const pipValue = lotSize * basePipValue;

      resultEl.className = 'calculator-result text-center font-bold text-lg';
      resultEl.textContent = 
        `Pip Value: $${pipValue.toFixed(2)} per pip`;
    }

    function calculateProfit() {
      const lotSize = parseFloat(document.getElementById('profitLotSize').value);
      const pips = parseFloat(document.getElementById('pipsMove').value);
      const pipValue = parseFloat(document.getElementById('pipValueInput').value);
      const resultEl = document.getElementById('profitResult');

      if (!lotSize || !pips || !pipValue) {
        resultEl.textContent = 'Please fill all fields';
        resultEl.className = 'text-center font-bold text-lg';
        return;
      }

      const profit = lotSize * pips * pipValue;
      const sign = profit >= 0 ? '+' : '';

      resultEl.className = 'calculator-result text-center font-bold text-lg';
      resultEl.textContent = 
        `${sign}$${profit.toFixed(2)}`;
    }
